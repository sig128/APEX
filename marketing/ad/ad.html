<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PropPickz ad</title>
<style>
/*
  "Read the line." A 30 s vertical spot, 1080x1920, rendered frame by frame.
  Spine: one gold line across the frame (the prop line). OVER lives above it, UNDER below.
  Palette (the site's own): night #050a14, stand #0a1220, seat #1c2b45, chalk #e8edf5,
  chalk-2 #aab5c7, chalk-3 #75839a, gold #fcd800, turf #2fd47a, flag #ff5a5a.
  Type: Big Shoulders Display for numbers and headlines, Barlow for labels.
*/
@font-face { font-family: 'BigShoulders'; src: url('fonts/bigshoulders-var.woff') format('woff'); font-weight: 100 900; }
@font-face { font-family: 'Barlow'; src: url('fonts/barlow-500.woff') format('woff'); font-weight: 500; }
@font-face { font-family: 'Barlow'; src: url('fonts/barlow-600.woff') format('woff'); font-weight: 600; }
@font-face { font-family: 'Barlow'; src: url('fonts/barlow-700.woff') format('woff'); font-weight: 700; }
@font-face { font-family: 'Barlow'; src: url('fonts/barlow-800.woff') format('woff'); font-weight: 800; }
@font-face { font-family: 'Barlow'; src: url('fonts/barlow-900.woff') format('woff'); font-weight: 900; }
html, body { margin: 0; background: #050a14; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict'
const W = 1080, H = 1920, CX = 540, LY = 960
const C = { night: '#050a14', stand: '#0a1220', stand2: '#0f1a2d', seat: '#1c2b45', seat2: '#2a3c5c', chalk: '#e8edf5', chalk2: '#aab5c7', chalk3: '#75839a', gold: '#fcd800', goldHi: '#fff3a6', turf: '#2fd47a', flag: '#ff5a5a' }
const BIG = 'BigShoulders', UI = 'Barlow'

const main = document.getElementById('c')
const out = main.getContext('2d')
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c }
const sceneCv = mk(), ctx = sceneCv.getContext('2d')
const tmpCv = mk(), tmp = tmpCv.getContext('2d')
const ovCv = mk(), ov = ovCv.getContext('2d') // captions drawn over the camera blur
const frmCv = mk(), frm = frmCv.getContext('2d') // one moment, composed
const accCv = mk(), acc = accCv.getContext('2d') // one frame: the moments inside the shutter, averaged
const bA = mk(), bAc = bA.getContext('2d'), bB = mk(), bBc = bB.getContext('2d') // smear ping-pong
const odoCv = mk(W, 695), odo = odoCv.getContext('2d') // the live counter's window
const FPS = 30
let DT = 1 / 120 // how much time one moment stands for (motion blur inside the moment)

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x)
const lerp = (a, b, k) => a + (b - a) * k
const seg = (t, a, b) => clamp((t - a) / (b - a))
const E = {
  outCubic: (k) => 1 - (1 - k) ** 3,
  outQuart: (k) => 1 - (1 - k) ** 4,
  outQuint: (k) => 1 - (1 - k) ** 5,
  outExpo: (k) => (k >= 1 ? 1 : 1 - 2 ** (-10 * k)),
  inExpo: (k) => (k <= 0 ? 0 : 2 ** (10 * k - 10)),
  inCubic: (k) => k ** 3,
  inOutCubic: (k) => (k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2),
  inOutExpo: (k) => (k <= 0 ? 0 : k >= 1 ? 1 : k < 0.5 ? 2 ** (20 * k - 10) / 2 : (2 - 2 ** (-20 * k + 10)) / 2),
  outBack: (k, s = 1.6) => 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2,
}
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s) }
const vnoise = (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1 }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let q = s; q = Math.imul(q ^ (q >>> 15), q | 1); q ^= q + Math.imul(q ^ (q >>> 7), q | 61); return ((q ^ (q >>> 14)) >>> 0) / 4294967296 } }

// ---------- the timeline's big moments (the soundtrack hits the same times) ----------
const IMPACTS = [[1.0, 1.0], [4.25, 0.45], [4.75, 0.45], [6.0, 0.55], [7.5, 0.7], [8.0, 1.25], [9.5, 0.8], [14.0, 0.5], [15.45, 0.55], [18.0, 0.55], [22.0, 1.35], [24.0, 1.1]]
const FLASHES = [[1.0, 0.18], [8.0, 0.42], [22.0, 0.55], [24.0, 0.5]]
const impactAt = (t) => IMPACTS.reduce((a, [ti, s]) => (t >= ti ? a + s * Math.exp(-(t - ti) * 9) : a), 0)
const kick = (t, ti, rate = 10) => (t >= ti ? Math.exp(-(t - ti) * rate) : 0)

// ---------- drawing helpers ----------
const font = (fam, wt, size) => `${wt} ${size}px ${fam}`
function txt(c, s, x, y, o = {}) {
  c.save()
  c.font = o.font
  c.textAlign = o.align || 'center'
  c.textBaseline = o.base || 'alphabetic'
  c.letterSpacing = `${o.ls || 0}px`
  c.globalAlpha *= o.alpha ?? 1
  if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = o.glowBlur || 30 }
  c.fillStyle = o.color || C.chalk
  const dx = o.ls && (o.align || 'center') === 'center' ? o.ls / 2 : 0
  if (o.chroma) {
    c.save(); c.shadowBlur = 0; c.globalCompositeOperation = 'lighter'
    c.fillStyle = `rgba(255,40,90,${0.55 * Math.min(1, o.chroma)})`; c.fillText(s, x + dx - 14 * o.chroma, y)
    c.fillStyle = `rgba(40,210,255,${0.55 * Math.min(1, o.chroma)})`; c.fillText(s, x + dx + 14 * o.chroma, y)
    c.restore()
  }
  c.fillText(s, x + dx, y)
  c.restore()
}
function measure(c, s, f, ls = 0) { c.save(); c.font = f; c.letterSpacing = `${ls}px`; const m = c.measureText(s); c.restore(); return m }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r) }
function goldLine(c, x0, x1, y, a = 1, glow = 1) {
  if (a <= 0 || x1 <= x0) return
  c.save()
  c.lineCap = 'round'
  c.globalAlpha = a
  c.strokeStyle = C.gold; c.shadowColor = C.gold
  c.shadowBlur = 60 * glow; c.lineWidth = 6; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke()
  c.shadowBlur = 18 * glow; c.lineWidth = 5; c.stroke()
  c.shadowBlur = 0; c.strokeStyle = '#fff7c9'; c.lineWidth = 2.5; c.stroke()
  c.restore()
}
function spark(c, x, y, r, a) {
  if (a <= 0) return
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a
  const g = c.createRadialGradient(x, y, 0, x, y, r)
  g.addColorStop(0, 'rgba(255,250,220,1)'); g.addColorStop(0.15, 'rgba(255,226,80,0.8)'); g.addColorStop(1, 'rgba(252,216,0,0)')
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2)
  c.restore()
}
function flare(c, x, y, a, len = 900) { // a thin horizontal lens streak
  if (a <= 0.003) return
  c.save(); c.globalCompositeOperation = 'lighter'; c.translate(x, y)
  for (const [sy, col, k] of [[0.011, '255,244,205', 0.95], [0.05, '120,175,255', 0.3]]) {
    c.save(); c.scale(1, sy)
    const g = c.createRadialGradient(0, 0, 0, 0, 0, len)
    g.addColorStop(0, `rgba(${col},${Math.min(1, k * a)})`); g.addColorStop(0.3, `rgba(${col},${Math.min(1, k * a * 0.35)})`); g.addColorStop(1, `rgba(${col},0)`)
    c.fillStyle = g; c.fillRect(-len, -len, len * 2, len * 2); c.restore()
  }
  c.restore()
}
function star(c, x, y, r, a) {
  if (a <= 0) return
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a; c.translate(x, y)
  for (const [sx, sy] of [[1, 0.06], [0.06, 1]]) {
    const g = c.createRadialGradient(0, 0, 0, 0, 0, r)
    g.addColorStop(0, 'rgba(255,252,235,1)'); g.addColorStop(1, 'rgba(255,230,120,0)')
    c.save(); c.scale(sx, sy); c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.restore()
  }
  spark(c, 0, 0, r * 0.35, 1)
  c.restore()
}

// ---------- the world around everything ----------
const vignette = (() => {
  const v = mk(), g = v.getContext('2d')
  const r = g.createRadialGradient(CX, LY, 300, CX, LY, 1250)
  r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(0.6, 'rgba(0,0,0,0.18)'); r.addColorStop(1, 'rgba(0,0,0,0.72)')
  g.fillStyle = r; g.fillRect(0, 0, W, H)
  return v
})()
const grains = [0, 1, 2, 3, 4, 5].map((k) => {
  const g = mk(384, 384), gc = g.getContext('2d'), img = gc.createImageData(384, 384), r = rng(77 + k)
  for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255 }
  gc.putImageData(img, 0, 0)
  return g
})
const DUST = (() => { const r = rng(11); return Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * H, s: 0.6 + r() * 2.2, v: 6 + r() * 18, ph: r() * 6.28, a: 0.15 + r() * 0.5 })) })()

function backdrop(c, t, o = {}) {
  const g = c.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, '#08142a'); g.addColorStop(0.5, C.night); g.addColorStop(1, '#02050b')
  c.fillStyle = g; c.fillRect(0, 0, W, H)
  if (o.glow) {
    const y = o.glowY ?? LY
    const r = c.createRadialGradient(CX, y, 0, CX, y, o.glowR || 900)
    r.addColorStop(0, `rgba(252,216,0,${0.13 * o.glow})`); r.addColorStop(0.45, `rgba(252,216,0,${0.04 * o.glow})`); r.addColorStop(1, 'rgba(252,216,0,0)')
    c.fillStyle = r; c.fillRect(0, 0, W, H)
  }
  if (o.beams) beams(c, t, o.beams)
  if (o.dust) dust(c, t, o.dust)
}
function beams(c, t, a) {
  c.save(); c.globalCompositeOperation = 'lighter'
  for (const side of [-1, 1]) {
    const ox = side < 0 ? -120 : W + 120
    const ang = side * (0.5 + 0.06 * Math.sin(t * 0.45 + side * 1.3))
    c.save(); c.translate(ox, -220); c.rotate(-ang)
    for (const [spread, alpha] of [[120, 0.05], [230, 0.035], [380, 0.022], [560, 0.012]]) {
      const g = c.createLinearGradient(0, 0, 0, 2700)
      g.addColorStop(0, `rgba(255,244,205,${alpha * a * 2.2})`); g.addColorStop(0.55, `rgba(255,236,170,${alpha * a})`); g.addColorStop(1, 'rgba(255,236,170,0)')
      c.fillStyle = g
      c.beginPath(); c.moveTo(-18, 0); c.lineTo(18, 0); c.lineTo(spread, 2700); c.lineTo(-spread, 2700); c.closePath(); c.fill()
    }
    c.restore()
  }
  c.restore()
}
function dust(c, t, a) {
  c.save(); c.globalCompositeOperation = 'lighter'
  for (const d of DUST) {
    const y = ((d.y - t * d.v) % H + H) % H
    const x = d.x + Math.sin(t * 0.7 + d.ph) * 14
    c.globalAlpha = a * d.a * (0.6 + 0.4 * Math.sin(t * 2 + d.ph))
    c.fillStyle = '#ffe9a0'; c.beginPath(); c.arc(x, y, d.s, 0, Math.PI * 2); c.fill()
  }
  c.restore()
}
function floor(c, t, a, horizon = LY) {
  if (a <= 0) return
  c.save()
  c.beginPath(); c.rect(0, horizon + 2, W, H - horizon); c.clip()
  c.lineWidth = 2
  for (let i = -14; i <= 14; i++) {
    const x = CX + i * 260
    const g = c.createLinearGradient(0, horizon, 0, H)
    g.addColorStop(0, 'rgba(170,181,199,0)'); g.addColorStop(0.35, `rgba(170,181,199,${0.07 * a})`); g.addColorStop(1, `rgba(170,181,199,${0.12 * a})`)
    c.strokeStyle = g
    c.beginPath(); c.moveTo(CX + i * 6, horizon); c.lineTo(CX + (x - CX) * 3.2, H + 200); c.stroke()
  }
  const off = (t * 0.35) % 1
  for (let j = 0; j < 14; j++) {
    const z = (j + off) / 14
    const y = horizon + (H - horizon) * z ** 2.2
    c.strokeStyle = `rgba(170,181,199,${0.1 * a * z})`
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke()
  }
  c.restore()
}
function rays(c, x, y, a, t) { // light rays behind the logo
  if (a <= 0) return
  c.save(); c.globalCompositeOperation = 'lighter'; c.translate(x, y); c.rotate(t * 0.05)
  for (let i = 0; i < 28; i++) {
    const ang = (i / 28) * Math.PI * 2, w = 0.028 + 0.02 * hash(i * 3.1)
    const len = 1300 + 500 * hash(i * 7.7)
    const g = c.createRadialGradient(0, 0, 60, 0, 0, len)
    g.addColorStop(0, `rgba(255,232,120,${0.11 * a * (0.5 + hash(i))})`); g.addColorStop(1, 'rgba(255,232,120,0)')
    c.fillStyle = g
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, len, ang - w, ang + w); c.closePath(); c.fill()
  }
  c.restore()
}
function bars(c, t, a) { // crowd lights: soft bokeh low in the frame
  if (a <= 0) return
  const r = rng(5)
  c.save(); c.globalCompositeOperation = 'lighter'
  for (let i = 0; i < 26; i++) {
    const x = r() * W, y = 1500 + r() * 520, rad = 30 + r() * 90, hue = r() < 0.7 ? '255,226,140' : '140,180,255'
    const tw = 0.5 + 0.5 * Math.sin(t * (1 + r() * 2) + i)
    const g = c.createRadialGradient(x, y, 0, x, y, rad)
    g.addColorStop(0, `rgba(${hue},${0.09 * a * tw})`); g.addColorStop(1, `rgba(${hue},0)`)
    c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2)
  }
  c.restore()
}

// =====================================================================================
// 1. THE LINE (0 to 4 s): a gold line, a number, the question every bettor asks
// =====================================================================================
const FLIPS = [[2.0, 'O'], [2.5, 'U'], [3.0, 'O'], [3.25, 'U'], [3.5, 'O'], [3.625, 'U']]
function scene1(c, t) {
  backdrop(c, t, { glow: 0.5 * E.outCubic(seg(t, 0.2, 1.4)) + 0.6 * kick(t, 1.0, 5), beams: 0.55 * seg(t, 0.9, 2.6), dust: 0.6 * seg(t, 0.5, 2) })
  floor(c, t, E.outCubic(seg(t, 0.5, 2.0)))
  const push = lerp(1.07, 1.0, E.outCubic(seg(t, 0, 4)))
  c.save(); c.translate(CX, LY); c.scale(push, push); c.translate(-CX, -LY)
  scene1Content(c, t)
  c.restore()
}
function scene1Content(c, t) {
  const draw = E.outExpo(seg(t, 0.12, 0.95))
  const half = draw * (W / 2 + 80)
  // the number sits on the line; the line opens around it
  const nIn = seg(t, 1.0, 1.32)
  const numF = font(BIG, 900, 430)
  const nm = measure(c, '24.5', numF)
  const gap = E.outExpo(nIn) * (nm.width / 2 + 46)
  goldLine(c, CX - half, CX - gap, LY, 1, 1 + kick(t, 1.0, 6))
  goldLine(c, CX + gap, CX + half, LY, 1, 1 + kick(t, 1.0, 6))
  spark(c, CX - half, LY, 120, (1 - draw) * 1.2 + 0.0)
  spark(c, CX + half, LY, 120, (1 - draw) * 1.2)
  flare(c, CX, LY, 1.1 * kick(t, 1.0, 2.6), 1000)
  if (t >= 1.0) {
    const k = E.outExpo(nIn)
    const sc = lerp(1.55, 1, k)
    const asc = nm.actualBoundingBoxAscent, desc = nm.actualBoundingBoxDescent
    c.save(); c.translate(CX, LY); c.scale(sc, sc)
    const g = c.createLinearGradient(0, -asc / 2, 0, asc / 2)
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9d3e3')
    txt(c, '24.5', 0, (asc - desc) / 2, { font: numF, color: g, alpha: seg(t, 1.0, 1.08), chroma: kick(t, 1.0, 7) * 1.2 })
    c.restore()
  }
  // eyebrow and label
  const eb = E.outCubic(seg(t, 1.2, 1.6))
  txt(c, 'TONIGHT’S LINE', CX, LY - 560 + (1 - eb) * 24, { font: font(UI, 800, 36), color: C.gold, ls: 12, alpha: eb })
  const pl = E.outQuart(seg(t, 1.45, 2.0))
  txt(c, 'POINTS', CX, LY + 230, { font: font(UI, 800, 50), color: C.chalk2, ls: lerp(70, 26, pl), alpha: pl })
  // OVER above the line, UNDER below, faster and faster
  for (let i = 0; i < FLIPS.length; i++) {
    const [ti, side] = FLIPS[i]
    const next = FLIPS[i + 1]?.[0] ?? 3.78
    if (t < ti || t >= next + 0.08) continue
    const k = seg(t, ti, ti + 0.06)
    const fade = 1 - seg(t, next - 0.05, next + 0.08)
    const a = k * fade
    const pop = lerp(1.18, 1, E.outCubic(seg(t, ti, ti + 0.18)))
    const over = side === 'O'
    const y = over ? LY - 330 : LY + 470
    c.save(); c.translate(CX, y); c.scale(pop, pop)
    txt(c, over ? 'OVER' : 'UNDER', 0, 0, { font: font(BIG, 900, 170), color: over ? C.gold : C.chalk, ls: 10, alpha: a, glow: over ? 'rgba(252,216,0,0.55)' : null, glowBlur: 40 })
    // a chevron pointing away from the line
    c.globalAlpha = a; c.fillStyle = over ? C.gold : C.chalk
    c.beginPath()
    if (over) { c.moveTo(-34, -150); c.lineTo(0, -190); c.lineTo(34, -150) } else { c.moveTo(-34, 38); c.lineTo(0, 78); c.lineTo(34, 38) }
    c.lineWidth = 10; c.strokeStyle = c.fillStyle; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke()
    c.restore()
  }
  // the question, last
  const q = E.outCubic(seg(t, 3.0, 3.3)) * (1 - seg(t, 3.7, 3.8))
  txt(c, 'WHICH SIDE?', CX, H - 250, { font: font(UI, 800, 40), color: C.chalk3, ls: 16, alpha: q })
}

// =====================================================================================
// 2. THE NOISE (4 to 8 s): thousands of lines blur past and stop on that same one
// =====================================================================================
const POOL = ['OVER 1.5 SHOTS ON GOAL', 'UNDER 6.5 REBOUNDS', 'OVER 257.5 PASS YARDS', 'ANYTIME TOUCHDOWN', 'OVER 0.5 HOME RUNS', 'UNDER 22.5 POINTS', 'OVER 4.5 ASSISTS', 'OVER 68.5 RUSH YARDS', 'UNDER 1.5 TOTAL BASES', 'OVER 2.5 THREES', 'OVER 5.5 RECEPTIONS', 'UNDER 28.5 SAVES', 'OVER 6.5 STRIKEOUTS', 'OVER 0.5 GOALS', 'UNDER 1.5 HITS', 'OVER 39.5 PTS + REB + AST', 'UNDER 54.5 REC YARDS', 'OVER 1.5 PASS TDS', 'OVER 11.5 REBOUNDS', 'OVER 1.5 BLOCKS', 'UNDER 3.5 SHOTS ON GOAL', 'OVER 19.5 PASS ATTEMPTS']
const HERO = 40, HERO_TEXT = 'OVER 24.5 POINTS', ROW = 132
const fitCache = new Map()
function rowFont(s) {
  if (!fitCache.has(s)) { const w = measure(ctx, s, font(BIG, 800, 96), 3).width; fitCache.set(s, font(BIG, 800, w > 940 ? Math.floor((96 * 940) / w) : 96)) }
  return fitCache.get(s)
}
const rowText = (i) => (i === HERO ? HERO_TEXT : POOL[(((i * 7 + 3) % POOL.length) + POOL.length) % POOL.length])
const reelU = (t) => seg(t, 4.0, 7.5)
function reelPos(t) {
  if (t < 7.5) return HERO * reelU(t) ** 2.4
  const s = t - 7.5
  return HERO + 0.28 * Math.exp(-13 * s) * Math.sin(44 * s)
}
const reelVel = (t) => (t < 7.5 ? (HERO * 2.4 * reelU(t) ** 1.4) / 3.5 : 0)
function scene2(c, t) {
  backdrop(c, t, { glow: 0.35, beams: 0.35, dust: 0.4 })
  const p = reelPos(t)
  const v = reelVel(t) * ROW // px per second, upward
  const span = Math.min(90, v * DT)
  const n = span > 3 ? Math.min(7, Math.ceil(span / 5)) : 1
  const frozen = t >= 7.5
  for (let i = Math.floor(p) - 9; i <= Math.ceil(p) + 9; i++) {
    const y0 = LY + (i - p) * ROW
    const d = Math.abs(y0 - LY)
    if (d > 1100) continue
    const near = clamp(1 - d / 80)
    const top = y0 < LY ? E.inOutCubic(seg(y0, 640, 860)) : 1
    const fadeEdge = (1 - (d / 1000) ** 2) * top
    const hero = i === HERO && frozen
    let a = clamp(fadeEdge) * (frozen && !hero ? 0.25 : 1)
    const color = near > 0.02 || hero ? mixGold(near) : C.chalk3
    for (let k = 0; k < n; k++) {
      const y = y0 + (span * k) / n + 33
      txt(c, rowText(i), CX, y, { font: rowFont(rowText(i)), color, ls: 3, alpha: (a * (n > 1 ? 1.5 : 1)) / n, glow: hero ? 'rgba(252,216,0,0.7)' : null, glowBlur: 40 })
    }
  }
  goldLine(c, 0, W, LY - 70, 0.9, 0.7)
  goldLine(c, 0, W, LY + 70, 0.9, 0.7)
  // copy over the reel
  const band = c.createLinearGradient(0, 0, 0, 860)

    const cf = { font: font(BIG, 900, 180), color: C.chalk, ls: 3, alpha: cap, glow: 'rgba(0,0,0,0.6)', glowBlur: 30 }
    txt(c, 'EVERY PROP.', 0, -18, cf)
    txt(c, 'READ.', 0, 150, cf)
    c.restore()
  }
}

// =====================================================================================
// 4. LIVE (18 to 24 s): the game is on, the count climbs past the line
// =====================================================================================
const STEPS = [[18.0, 22], [19.0, 23], [20.0, 24], [22.0, 26]]
const BURST = (() => { const r = rng(42); return Array.from({ length: 110 }, () => ({ a: r() * Math.PI * 2, v: 300 + r() * 1300, life: 0.5 + r() * 1.0, w: 2 + r() * 4 })) })()
function countAt(t) { let v = STEPS[0][1]; for (const [ti, n] of STEPS) if (t >= ti) v = n; return v }
function scene4(c, t) {
  const tension = seg(t, 20.5, 22.0)
  backdrop(c, t, { glow: 0.35 + 0.4 * tension + 0.9 * kick(t, 22.0, 3), glowY: 1360, glowR: 1000, beams: 0.55 + 0.5 * tension, dust: 0.5 })
  bars(c, t, 1.6)
  const punch = 1 + 0.06 * kick(t, 22.0, 2.2) + 0.02 * tension
  c.save(); c.translate(CX, 1150); c.scale(punch, punch); c.translate(-CX, -1150); c.translate(0, -LIVE_UP)
  scene4Content(c, t, tension)
  c.restore()
  // into the last scene: the marker becomes the line, in frame space so it lands where scene 5 starts
  if (t > 23.2) {
    const k = E.inOutExpo(seg(t, 23.25, 24.0))
    const sx = CX + (MARK_X - CX) * punch, sy = 1150 + (TRACK.y - LIVE_UP - 1150) * punch
    const y = lerp(sy, LY, k), half = lerp(4, W / 2 + 40, k), x = lerp(sx, CX, k)
    goldLine(c, x - half, x + half, y, 1, 1 + k)
  }
}
const LIVE_UP = 60, TRACK = { x0: 110, x1: 970, y: 1370, max: 30 }
const MARK_X = TRACK.x0 + ((TRACK.x1 - TRACK.x0) * 24.5) / TRACK.max
function scene4Content(c, t, tension) {
  const inK = E.outExpo(seg(t, 18.0, 18.4))
  const outK = E.inCubic(seg(t, 23.15, 23.6))
  const a = inK * (1 - outK)
  // LIVE row
  const blink = 0.55 + 0.45 * Math.cos((t - 18) * Math.PI * 2)
  c.save(); c.globalAlpha = a; rr(c, CX - 300, 250, 250, 84, 42); c.fillStyle = 'rgba(255,90,90,0.14)'; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,90,90,0.6)'; c.stroke()
  c.fillStyle = C.flag; c.globalAlpha = a * blink; c.shadowColor = C.flag; c.shadowBlur = 20; c.beginPath(); c.arc(CX - 250, 292, 13, 0, Math.PI * 2); c.fill(); c.restore()
  txt(c, 'LIVE', CX - 160, 307, { font: font(UI, 900, 42), color: C.chalk, ls: 8, alpha: a })
  const sec = 134 - Math.floor((t - 18) / 0.5) * 3
  const clock = `Q4  ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`
  txt(c, clock, CX + 170, 307, { font: font(UI, 800, 48), color: C.chalk2, ls: 4, alpha: a })
  txt(c, 'A. MORALES', CX, 470, { font: font(UI, 800, 56), color: C.chalk, ls: 4, alpha: a })
  txt(c, 'POINTS TONIGHT', CX, 530, { font: font(UI, 700, 34), color: C.chalk3, ls: 10, alpha: a })
  // the counter, odometer style
  const fC = font(BIG, 900, 620)
  let prev = STEPS[0][1], cur = prev, tStep = 18.0
  for (const [ti, n] of STEPS) if (t >= ti) { prev = cur; cur = n; tStep = ti }
  const roll = E.outQuint(seg(t, tStep, tStep + 0.32))
  const pulse = 1 + 0.035 * tension * Math.max(0, Math.sin((t - 20.5) * Math.PI * 4))
  const cashed = t >= 22.0
  // the counter rolls inside a window with soft top and bottom edges
  odo.setTransform(1, 0, 0, 1, 0, 0); odo.globalAlpha = 1; odo.globalCompositeOperation = 'source-over'; odo.clearRect(0, 0, W, 695)
  odo.save(); odo.translate(CX, 605)
  if (roll < 1 && t > 18.2) txt(odo, String(prev), 0, -roll * 520, { font: fC, color: C.chalk, alpha: a * (1 - roll) })
  txt(odo, String(cur), 0, (1 - roll) * 520 * (t > 18.2 ? 1 : 0), { font: fC, color: cashed ? C.gold : C.chalk, alpha: a, glow: cashed ? 'rgba(252,216,0,0.6)' : null, glowBlur: 70, chroma: kick(t, 22.0, 7) * 1.2 })
  odo.restore()
  odo.save(); odo.globalCompositeOperation = 'destination-in'
  const fm = odo.createLinearGradient(0, 0, 0, 695)
  fm.addColorStop(0, 'rgba(0,0,0,0)'); fm.addColorStop(0.086, '#000'); fm.addColorStop(0.885, '#000'); fm.addColorStop(1, 'rgba(0,0,0,0)')
  odo.fillStyle = fm; odo.fillRect(0, 0, W, 695); odo.restore()
  c.save(); c.translate(CX, 1150); c.scale(pulse, pulse); c.drawImage(odoCv, -CX, -605); c.restore()
  // +n tag
  if (t > 18.9) {
    const gain = cur - prev, k = seg(t, tStep, tStep + 0.9)
    if (k < 1 && gain > 0) txt(c, `+${gain}`, CX + 300, 760 - k * 80, { font: font(BIG, 900, 110), color: C.turf, alpha: a * (1 - k) * clamp(k * 8), glow: 'rgba(47,212,122,0.6)', glowBlur: 30 })
  }
  // progress toward the line
  const { x0: tx0, x1: tx1, y: ty, max } = TRACK
  const shown = lerp(prev, cur, roll)
  const mx = tx0 + ((tx1 - tx0) * 24.5) / max
  c.save(); c.globalAlpha = a; rr(c, tx0, ty - 14, tx1 - tx0, 28, 14); c.fillStyle = 'rgba(28,43,69,0.95)'; c.fill()
  rr(c, tx0, ty - 14, ((tx1 - tx0) * shown) / max, 28, 14); c.fillStyle = cashed ? C.gold : C.turf; c.shadowColor = cashed ? 'rgba(252,216,0,0.8)' : 'rgba(47,212,122,0.6)'; c.shadowBlur = 30; c.fill(); c.restore()
  // the line marker on the track
  const mf = 1 + 2 * kick(t, 22.0, 5)
  c.save(); c.globalAlpha = a; c.strokeStyle = cashed ? '#fff7c9' : C.gold; c.shadowColor = C.gold; c.shadowBlur = 30 * mf; c.lineWidth = 6; c.lineCap = 'round'
  c.beginPath(); c.moveTo(mx, ty - 46); c.lineTo(mx, ty + 46); c.stroke(); c.restore()
  txt(c, 'LINE 24.5', mx, ty - 70, { font: font(UI, 900, 32), color: C.gold, ls: 4, alpha: a })
  // burst when it crosses
  if (cashed && t < 23.6) {
    const dt = t - 22.0
    c.save(); c.globalCompositeOperation = 'lighter'
    for (const p of BURST) {
      if (dt > p.life) continue
      const d = p.v * dt * (1 - dt / (p.life * 2)), x = mx + Math.cos(p.a) * d, y = ty + Math.sin(p.a) * d + 220 * dt * dt
      const tail = p.v * 0.03
      c.globalAlpha = (1 - dt / p.life) * a
      c.strokeStyle = '#ffe680'; c.lineWidth = p.w; c.lineCap = 'round'
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - Math.cos(p.a) * tail, y - Math.sin(p.a) * tail); c.stroke()
    }
    c.restore()
    spark(c, mx, ty, 320, kick(t, 22.0, 4) * 1.4)
    flare(c, mx, ty, 1.2 * kick(t, 22.0, 2.4), 1100)
    // shockwave
    const wk = seg(t, 22.0, 22.7)
    if (wk < 1) {
      c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = `rgba(255,236,150,${0.7 * (1 - wk)})`; c.lineWidth = 14 * (1 - wk) + 2
      c.beginPath(); c.arc(mx, ty, 40 + E.outCubic(wk) * 900, 0, Math.PI * 2); c.stroke(); c.restore()
    }
  }
  // CASHED
  if (cashed) {
    const k = seg(t, 22.0, 22.28)
    const sc = lerp(2.4, 1, E.outBack(k, 1.2))
    c.save(); c.translate(CX, 1620); c.rotate(-0.07); c.scale(sc, sc); c.globalAlpha = clamp(k * 4) * a
    const f = font(BIG, 900, 190), m = measure(c, 'CASHED', f, 10)
    rr(c, -m.width / 2 - 46, -170, m.width + 92, 210, 26); c.lineWidth = 10; c.strokeStyle = C.gold; c.shadowColor = 'rgba(252,216,0,0.8)'; c.shadowBlur = 50; c.stroke()
    c.restore()
    c.save(); c.translate(CX, 1620); c.rotate(-0.07); c.scale(sc, sc)
    txt(c, 'CASHED', 0, 0, { font: font(BIG, 900, 190), color: C.gold, ls: 10, alpha: clamp(k * 4) * a, glow: 'rgba(252,216,0,0.7)', glowBlur: 50, chroma: kick(t, 22.0, 7) })
    c.restore()
  }
  const cap = E.outCubic(seg(t, 22.55, 22.9)) * (1 - outK)
  txt(c, 'Tracked live. Graded from the box score.', CX, 1760, { font: font(UI, 700, 44), color: C.chalk2, alpha: cap })
}

// =====================================================================================
// 5. THE BRAND (24 to 30 s): the logo comes out of the line
// =====================================================================================
let WORD = null
const BRAND_Y = 800
const GOLDDUST = (() => { const r = rng(9); return Array.from({ length: 90 }, () => ({ x: r() * W, y: 300 + r() * 1500, s: 0.8 + r() * 2.6, v: 20 + r() * 60, ph: r() * 6.28 })) })()
function scene5(c, t) {
  const fadeOut = seg(t, 29.25, 30.0)
  backdrop(c, t, { glow: 0.55 + 1.1 * kick(t, 24.0, 2.4), glowY: 820, glowR: 1050, beams: 0.45, dust: 0 })
  floor(c, t, 0.7 * (1 - fadeOut), 1000)
  rays(c, CX, lerp(LY, BRAND_Y, E.inOutCubic(seg(t, 24.95, 25.5))), E.outCubic(seg(t, 24.05, 24.9)) * (1 - fadeOut) * (1 + kick(t, 24.0, 3)), t)
  // rising gold dust
  c.save(); c.globalCompositeOperation = 'lighter'
  for (const d of GOLDDUST) {
    const life = t - 24
    if (life < 0) continue
    const y = d.y - life * d.v, x = d.x + Math.sin(life * 1.2 + d.ph) * 18
    c.globalAlpha = 0.5 * clamp(life * 2) * (0.5 + 0.5 * Math.sin(t * 3 + d.ph)) * (1 - fadeOut)
    c.fillStyle = '#ffe27a'; c.beginPath(); c.arc(x, y, d.s, 0, Math.PI * 2); c.fill()
  }
  c.restore()
  const rise = E.inOutCubic(seg(t, 24.95, 25.5))
  const cy = lerp(LY, BRAND_Y, rise)
  const ww = 900, sc = ww / WORD.w, wh = WORD.h * sc
  const rev = E.outExpo(seg(t, 24.0, 24.5))
  // the line: full width, then it tightens under the word
  const tight = E.inOutExpo(seg(t, 24.35, 24.95))
  const lineY = lerp(cy, cy + wh / 2 + 40, tight)
  const half = lerp(W / 2 + 40, ww / 2, tight)
  goldLine(c, CX - half, CX + half, lineY, 1 - fadeOut, 1.2 + kick(t, 24.0, 4) * 2)
  // the word, unfolding from the line
  if (rev > 0) {
    c.save()
    c.beginPath(); c.rect(0, cy - (wh / 2) * rev - 2, W, wh * rev + 4); c.clip()
    c.translate(CX - ww / 2, cy - wh / 2); c.scale(sc, sc)
    const g = c.createLinearGradient(0, 0, 0, WORD.h)
    g.addColorStop(0, '#ffe94d'); g.addColorStop(0.55, C.gold); g.addColorStop(1, '#efc200')
    c.fillStyle = g; c.shadowColor = 'rgba(252,216,0,0.55)'; c.shadowBlur = 70 / sc * (1 + kick(t, 24.0, 3))
    c.globalAlpha = 1 - fadeOut
    c.fill(WORD.path)
    // light sweep across the letters
    const sw = seg(t, 24.55, 25.2)
    if (sw > 0 && sw < 1) {
      c.save(); c.clip(WORD.path); c.globalCompositeOperation = 'lighter'; c.shadowBlur = 0
      const x = lerp(-260, WORD.w + 260, E.inOutCubic(sw))
      const lg = c.createLinearGradient(x - 90, 0, x + 90, 0)
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,240,0.95)'); lg.addColorStop(1, 'rgba(255,255,255,0)')
      c.fillStyle = lg; c.setTransform(c.getTransform().multiply(new DOMMatrix().skewXSelf(-18))); c.fillRect(-400, -20, WORD.w + 800, WORD.h + 40)
      c.restore()
    }
    c.restore()
  }
  flare(c, CX, cy, 1.25 * kick(t, 24.0, 1.8), 1100)
  flare(c, CX + ww / 2 - 40, cy - wh / 2 + 6, 0.7 * kick(t, 25.15, 3) * (t > 25.15 ? 1 : 0), 700)
  star(c, CX + ww / 2 - 40, cy - wh / 2 + 6, 150, kick(t, 25.15, 3) * (t > 25.15 ? 1 : 0) * (1 - fadeOut))
  // the tagline, one word a beat
  const words = [['READ', 25.25], ['THE', 25.5], ['LINE.', 25.75]]
  const tf = font(BIG, 900, 132)
  const ws = words.map(([w]) => measure(c, w, tf, 6).width)
  const total = ws.reduce((a, b) => a + b, 0) + 40 * 2
  let x = CX - total / 2
  words.forEach(([w, ti], i) => {
    const k = seg(t, ti, ti + 0.06)
    const pop = lerp(1.25, 1, E.outExpo(seg(t, ti, ti + 0.3)))
    c.save(); c.translate(x + ws[i] / 2, 1050); c.scale(pop, pop)
    txt(c, w, 0, 0, { font: tf, color: i === 2 ? C.gold : C.chalk, ls: 6, alpha: k * (1 - fadeOut), chroma: kick(t, ti, 10) * 0.8 })
    c.restore()
    x += ws[i] + 40
  })
  const d = E.outCubic(seg(t, 26.6, 27.1)) * (1 - fadeOut)
  txt(c, 'Hit rates, real prices, model reads and live', CX, 1150 + (1 - d) * 24, { font: font(UI, 600, 44), color: C.chalk2, alpha: d })
  txt(c, 'tracking for every player prop.', CX, 1210 + (1 - d) * 24, { font: font(UI, 600, 44), color: C.chalk2, alpha: d })
  const cta = E.outBack(seg(t, 27.6, 28.0), 1.4)
  if (cta > 0) {
    c.save(); c.translate(CX, 1340); c.scale(cta, cta)
    pill(c, 0, 0, 'TRY IT FREE', { stroke: C.gold, color: C.gold, size: 46, ls: 10, alpha: clamp(cta) * (1 - fadeOut) })
    c.restore()
  }
  const legal = E.outCubic(seg(t, 27.9, 28.35)) * (1 - fadeOut)
  txt(c, '21+. Please bet responsibly.', CX, 1480, { font: font(UI, 600, 30), color: C.chalk3, alpha: legal })
  txt(c, 'Gambling problem? Call 1-800-MY-RESET.', CX, 1524, { font: font(UI, 600, 30), color: C.chalk3, alpha: legal })
  txt(c, 'PropPickz is a research tool, not a sportsbook.', CX, 1568, { font: font(UI, 600, 30), color: C.chalk3, alpha: legal })
}

// =====================================================================================
// compositing: camera shake, motion blur on the whips, glitch, flashes, grain, vignette
// =====================================================================================
function camVel(t) {
  if (t < 8 || t >= 18) return { vy: 0, vs: 0 }
  const h = 1 / 480, a = cam3(t - h), b = cam3(t + h)
  return { vy: ((b.y - a.y) / (2 * h)) * cam3(t).s, vs: (b.s - a.s) / (2 * h) }
}
function glitch(t) { return t >= 3.74 && t < 4.04 ? 1 - Math.abs((t - 3.89) / 0.15) : t >= 7.46 && t < 7.56 ? 0.6 : 0 }
// Smear a picture along a camera move. Each pass doubles the copies, so p passes give 2^p - 1
// evenly spaced taps (a box blur along the move) for 2p draws.
function smear(src, dy, dz) {
  const reach = Math.max(Math.abs(dy), 1100 * Math.abs(dz))
  if (reach < 1.5) return null
  const p = Math.min(7, Math.ceil(Math.log2(reach / 1.5 + 1)))
  const taps = 2 ** p - 1
  const d = dy / taps, lz = Math.log1p(dz) / taps
  let from = src, cv = bA, c = bAc
  for (let i = 0; i < p; i++) {
    const m = 2 ** i, sc = Math.exp(lz * m)
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'copy'; c.globalAlpha = 1
    c.drawImage(from, 0, 0)
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 0.5
    c.translate(CX, LY); c.scale(sc, sc); c.translate(-CX, -LY + (d * m) / sc)
    c.drawImage(from, 0, 0)
    from = cv
    if (cv === bA) { cv = bB; c = bBc } else { cv = bA; c = bAc }
  }
  return { cv: from, zoom: Math.exp(lz * taps) }
}

/** One moment of the film, composed into frm: the scene, camera shake and smear, captions, flashes, fades. */
function moment(t, dt) {
  T = t; DT = dt
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0
  ov.setTransform(1, 0, 0, 1, 0, 0); ov.clearRect(0, 0, W, H)
  if (t < 4) scene1(ctx, t)
  else if (t < 8) scene2(ctx, t)
  else if (t < 18) scene3(ctx, t)
  else if (t < 24) scene4(ctx, t)
  else scene5(ctx, t)

  const o = frm
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalAlpha = 1; o.globalCompositeOperation = 'source-over'
  o.fillStyle = C.night; o.fillRect(0, 0, W, H)
  const amp = impactAt(t) * 13
  const sx = vnoise(t * 41) * amp, sy = vnoise(t * 47 + 100) * amp, sr = vnoise(t * 29 + 200) * amp * 0.0012
  const over = 1.025
  const { vy, vs } = camVel(t)
  const s3 = t >= 8 && t < 18 ? cam3(t).s : 1
  const dyS = -vy * dt, dzS = (vs * dt) / s3 // how far the picture moves and zooms during this moment
  const sm = smear(sceneCv, dyS, dzS)
  const zc = sm ? 1 / Math.sqrt(sm.zoom) : 1 // centre the smear on the moment
  o.save(); o.translate(CX + sx, LY + sy); o.rotate(sr); o.scale(over * zc, over * zc); o.translate(-CX, -LY - (sm ? dyS / 2 : 0)); o.drawImage(sm ? sm.cv : sceneCv, 0, 0); o.restore()
  o.save(); o.translate(CX + sx, LY + sy); o.rotate(sr); o.scale(over, over); o.translate(-CX, -LY); o.drawImage(ovCv, 0, 0); o.restore()
  // flashes
  const fl = FLASHES.reduce((a, [ti, s]) => (t >= ti ? a + s * Math.exp(-(t - ti) * 13) : a), 0)
  if (fl > 0.003) { o.save(); o.globalCompositeOperation = 'lighter'; o.fillStyle = `rgba(255,248,225,${Math.min(0.8, fl)})`; o.fillRect(0, 0, W, H); o.restore() }
  // fade from and to night
  const black = Math.max(1 - seg(t, 0, 0.15), seg(t, 29.6, 30.0))
  if (black > 0) { o.fillStyle = `rgba(5,10,20,${black})`; o.fillRect(0, 0, W, H) }
}

/** The finished frame on the visible canvas: glitch, vignette and grain, once per frame. */
function finish(tf) {
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1; out.globalCompositeOperation = 'copy'
  out.drawImage(accCv, 0, 0)
  out.globalCompositeOperation = 'source-over'
  // glitch: slices and split color
  const gl = glitch(tf)
  if (gl > 0) {
    tmp.setTransform(1, 0, 0, 1, 0, 0); tmp.globalCompositeOperation = 'copy'; tmp.globalAlpha = 1
    tmp.drawImage(accCv, 0, 0); tmp.globalCompositeOperation = 'source-over'
    const r = rng(Math.floor(tf * 90))
    for (let i = 0; i < 14; i++) {
      const y = r() * H, h = 20 + r() * 140, dx = (r() - 0.5) * 260 * gl
      out.drawImage(tmpCv, 0, y, W, h, dx, y, W, h)
    }
    out.save(); out.globalCompositeOperation = 'lighter'; out.globalAlpha = 0.35 * gl
    tmp.globalCompositeOperation = 'multiply'; tmp.fillStyle = '#ff1e5a'; tmp.fillRect(0, 0, W, H)
    out.drawImage(tmpCv, -22 * gl, 0)
    tmp.globalCompositeOperation = 'copy'; tmp.drawImage(accCv, 0, 0); tmp.globalCompositeOperation = 'multiply'; tmp.fillStyle = '#1edcff'; tmp.fillRect(0, 0, W, H)
    out.drawImage(tmpCv, 22 * gl, 0)
    out.restore()
    tmp.globalCompositeOperation = 'source-over'
  }
  out.drawImage(vignette, 0, 0)
  // film grain, 24 times a second
  const gi = Math.floor(tf * 24)
  out.save(); out.globalCompositeOperation = 'overlay'; out.globalAlpha = 0.16
  const r = rng(gi + 5)
  out.translate(-r() * 384, -r() * 384); out.fillStyle = out.createPattern(grains[gi % grains.length], 'repeat'); out.fillRect(0, 0, W + 384, H + 384)
  out.restore()
}

/** Frame f of the film at FPS: S moments spread over a half-frame shutter, averaged. */
function frameAt(f, S = 4, shutter = 0.5) {
  const tf = f / FPS
  acc.setTransform(1, 0, 0, 1, 0, 0); acc.globalCompositeOperation = 'source-over'
  for (let k = 0; k < S; k++) {
    const t = Math.max(0, tf + ((k + 0.5) / S - 0.5) * (shutter / FPS))
    moment(t, shutter / (FPS * S))
    acc.globalAlpha = 1 / (k + 1) // running mean: every moment weighs the same
    acc.drawImage(frmCv, 0, 0)
  }
  acc.globalAlpha = 1
  finish(tf)
}

// ---------- boot ----------
window.ready = (async () => {
  const wm = await (await fetch('wordmark.json')).json()
  WORD = { ...wm, path: new Path2D(wm.d) }
  await Promise.all([font(BIG, 900, 100), font(BIG, 800, 100), font(UI, 600, 40), font(UI, 700, 40), font(UI, 800, 40), font(UI, 900, 40)].map((f) => document.fonts.load(f)))
  await document.fonts.ready
  frameAt(0, 1)
  return true
})()
// a still: one moment at time t
window.renderAt = (t) => { moment(t, 1 / 240); acc.globalAlpha = 1; acc.globalCompositeOperation = 'copy'; acc.drawImage(frmCv, 0, 0); acc.globalCompositeOperation = 'source-over'; finish(t); return true }
window.renderFrame = (f, S, shutter) => { frameAt(f, S, shutter); return true }
</script>
