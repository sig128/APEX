# The iPhone app, built on GitHub's Macs (Xcode 26, which the App Store requires since
# April 28, 2026). Every change to the iOS project compiles it for the simulator, no Apple
# account needed. Run it by hand with "Upload to TestFlight" ticked once the Apple keys are in
# this repo's settings (see frontend/ios/README.md): it signs, uploads, and the build shows up
# in TestFlight on the owner's iPhone.
name: iPhone app

on:
  push:
    branches: [main]
    paths:
      - 'frontend/ios/**'
      - 'frontend/capacitor.config.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Sign and upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      # the website's Firebase settings, as on Vercel. The project's names and ids are fixed facts
      # (public in every page of the website), so they're filled in here; the key comes from this
      # repo's settings, as a secret or a variable.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'apexdashai.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'apexdashai' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'apexdashai.firebasestorage.app' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '239784293399' }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:239784293399:web:d01d5564a26c5afd171852' }}
      APPLE_TEAM: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Install
        run: npm ci

      - name: Build the app's screens into the iOS project
        run: |
          [ -n "$VITE_FIREBASE_API_KEY" ] || echo "::warning::No VITE_FIREBASE_API_KEY in this repo's settings: this build has no sign-in"
          npm run build:native && npx cap sync ios

      - name: Firebase's app file
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          F=ios/App/App/GoogleService-Info.plist
          if [ -n "$PLIST" ]; then
            # the file's text pasted as it is, or the same file in base64 (which has no "<")
            case "$PLIST" in
              *"<"*) printf '%s\n' "$PLIST" > "$F" ;;
              *) printf '%s' "$PLIST" | base64 --decode > "$F" ;;
            esac
            REV=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$F") || { echo "::error::GOOGLE_SERVICE_INFO_PLIST isn't a GoogleService-Info.plist from Firebase: paste the whole file's text"; exit 1; }
            echo "GOOGLE_REVERSED_CLIENT_ID=$REV" >> "$GITHUB_ENV"
            echo "Firebase app file in place"
          else
            echo "::warning::No GOOGLE_SERVICE_INFO_PLIST secret: this build can't sign in with Google"
            echo "GOOGLE_REVERSED_CLIENT_ID=com.googleusercontent.apps.not-set-up" >> "$GITHUB_ENV"
          fi

      - name: Compile for the simulator
        if: env.UPLOAD != 'true'
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID" CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/build.log" 2>&1 || { tail -120 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build.log"

      - name: Check the Apple keys are in place
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 VITE_FIREBASE_API_KEY; do [ -z "${!v}" ] && missing="$missing $v"; done
          [ -n "$APPLE_TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -f ios/App/App/GoogleService-Info.plist ] || missing="$missing GOOGLE_SERVICE_INFO_PLIST"
          if [ -n "$missing" ]; then echo "::error::Missing in the repo's Actions settings:$missing (see frontend/ios/README.md)"; exit 1; fi

      - name: Sign and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ env.APPLE_TEAM }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PropPickz.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID" "${AUTH[@]}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -150 "$RUNNER_TEMP/archive.log"; exit 1; }
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PropPickz.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { tail -150 "$RUNNER_TEMP/export.log"; exit 1; }
          rm -f "$KEY"
          echo "Uploaded build ${{ github.run_number }}: it shows up in TestFlight after Apple's processing (usually 10 to 30 minutes)."
